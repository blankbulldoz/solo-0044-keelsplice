<section class="triage" aria-live="polite">

    <p role="alert" class="notice info $style">$headline</p></div>
    <div class="triage-badges">$badges</div></header>
  <h3>根记录</h3>
  <div class="scroll"><table>
    <thead><tr><th>输入序号</th><th>判定</th><th>输入</th><th>原因</th></tr></thead>
    <tbody>$root_rows</tbody>
  </table></div>
  <h3>反向关系</h3>
  <div class="scroll"><table>
    <thead><tr><th>输入序号</th><th>判定</th><th>输入</th><th>原因</th></tr></thead>
    <tbody>$edge_rows</tbody>
  </table></div>
  <h3>整体形状</h3>
  $problems
</section>
