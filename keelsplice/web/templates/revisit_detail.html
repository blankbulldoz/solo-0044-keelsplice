<div class="content">
  <header class="pagehead"><div><p class="breadcrumb"><a href="/workbench/revisits">交接回访</a> / 详情</p>
    <h1>回访详情</h1></div>$overall</header>
  <dl class="facts">
    <div class="wide"><dt>回访编号</dt><dd><code>$id</code></dd></div>
    <div><dt>对应交付</dt><dd><a href="$capture_href"><code>$capture</code></a></dd></div>

  $sections

    <form class="revisit-form" method="post" action="/workbench/revisits/$id/recheck">
      <label>选择结论编号<select name="subject" required>$recheck_options</select></label>
      <button>从封存记录独立重算</button>
    </form>
    $recheck
  </section>
