<div class="content">
  <header class="pagehead">
    <div><p class="breadcrumb"><a href="/workbench/captures">封存捕获</a> / <a href="$base">详情</a> / 入选行</p>
    <h1>$table · 封存入选行</h1></div>

      <table>
        <thead><tr><th scope="col">#</th>$columns<th scope="col">操作</th></tr></thead>
